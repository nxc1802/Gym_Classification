# Default Verified Configuration for SkelGym Exercise Classification

# Dataset & Paths
metadata_path: "Final_dataset_metadata.csv"
landmark_dir: "data/landmarks"
output_dir: "outputs"
checkpoint_dir: "checkpoints"

# Feature & Model Settings
feature_method: "mix"           # Default: 117-d compound representation (39-d relative 3D + 78-d elevation angles)
                                # Choices: mix, rel_3d, bone_3d, joint_motion_3d, bone_motion_3d, 12rel_4, full_4, angle2, angle3
model_type: "Transformer"       # Primary choices: Transformer, AAGCN, STGCN, LSTM, BiLSTM

# Augmentation Protocol
augmentation: "skel_gym_aug"    # Default task-oriented protocol: Bilateral Sagittal Reflection + Gravitational Yaw + Anatomical Scale
                                # Choices: skel_gym_aug, none, mirror, yaw, scale, jitter, dropout

# Training Hyperparameters
seed: 42
device: "auto"                  # Choices: auto (cuda -> mps -> cpu), cuda, mps, cpu
batch_size: 16
epochs: 100
learning_rate: 0.0001
weight_decay: 0.0001
patience: 10
seq_len: 32                     # 1.07 seconds observation horizon at 30 FPS
train_stride: 16                # 50% temporal window overlap for dense training coverage
val_test_stride: 32             # Non-overlapping windows for strict validation and evaluation
num_workers: 0

# Architecture Dimensions
hidden_dim: 128
num_layers: 3
nhead: 8
dropout: 0.2
