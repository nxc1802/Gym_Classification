# BlockGCN Single-Stream (Joint 3D), 33 MediaPipe Landmarks, 32 Frames
# Paper: "BlockGCN: Redefine Topology Awareness for Skeleton-Based Action Recognition" (CVPR 2024)
# Protocol: Pure External Strong Baseline (Untuned, Original Recipe Adapted to 33-joint MediaPipe)

model: BlockGCN
upstream_model: src.external.blockgcn.model.BlockGCNModel
pretrained: false

model_args:
  num_class: 22
  num_point: 33
  num_person: 1
  in_channels: 3
  window_size: 32
  drop_out: 0.0
  graph: src.external.blockgcn.graph.MediaPipe33Graph

data:
  feature: raw_33_xyz
  stream: joint
  seq_len: 32
  train_stride: 16
  val_test_stride: 32
  normalization: false      # No Z-score normalization per original recipe
  center_joint: "hip_midpoint" # Center on hip midpoint to eliminate camera drift

training:
  optimizer: SGD
  base_lr: 0.05
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0004
  loss: cross_entropy
  batch_size: 64
  warm_up_epoch: 5
  step: [110, 120]
  lr_decay_rate: 0.1
  num_epoch: 140
  early_stopping: false     # Full 140 epochs as prescribed in upstream paper

evaluation:
  checkpoint_selection: best_val_accuracy
  seeds: [42, 123, 3407]

hf_sync:
  enabled: false            # Toggleable via CLI --push_to_hf
  repo_id: "Cuong2004/gym-exercise-classification"
